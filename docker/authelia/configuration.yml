      - client_id: 'comfyui-curu-auth'
        client_name: 'comfyui_curu_auth local test harness'
        # Fixed, committed secret -- meaningless outside this harness.
        # Plaintext value: 'local-harness-oidc-client-secret'
        # (specs/002-oidc-login/research.md).
        client_secret: '$pbkdf2-sha512$310000$M41rYFdleyS2gbdaZNMVUw$vPW4PyjlYQcuFF9s6iGev2npI2nEbd/xjYWv2JGMHLQkZduCcGkYVv.vuZOOfURPn6Wzws/rDHwUl6liEnb3vg'
        public: false
        redirect_uris:
          - 'http://127.0.0.1:8188/curu-auth/oidc/callback'
        grant_types:
          - 'authorization_code'
        response_types:
          - 'code'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        token_endpoint_auth_method: 'client_secret_post'
        authorization_policy: 'one_factor'
        # Skips the interactive consent screen entirely -- required for
        # the headless login flow tests/system/'s live suite drives
        # (T009 spike; research.md's headless-login decision). Acceptable
        # here specifically because this client only ever exists inside
        # this disposable, single-purpose test harness.
        consent_mode: 'implicit'
