# Authelia (Lite bundle: file-based users, SQLite storage, no Postgres/
# Redis) -- the local test IdP for the oidc-auth epic's live verification,
# per ADR-002. Every secret below is fixed and committed, meaningless
# outside this disposable harness -- same precedent as docker-compose.yml's
# own COMFYUI_CURU_AUTH_TOKEN (ADR-001). See specs/002-oidc-login/research.md
# for why `authelia.internal` (not the bare `authelia` service name, and not
# an IP) is the hostname used throughout: Authelia's own cookie-domain
# validation requires a dot or an IP, and its `iss` claim is derived
# per-request from whichever configured domain matches the request that
# drove the authorization call -- both the gate (container-side) and the
# live test (host-side, via a Host/SNI override) must resolve to the exact
# same value.

server:
  address: 'tcp://:9091'
  tls:
    certificate: '/config/server.crt'
    key: '/config/server.key'

log:
  level: 'info'

identity_validation:
  reset_password:
    # Reset-password flow is never exercised by this harness -- fixed
    # value only because Authelia requires one to start.
    jwt_secret: '030f793140ca4441aa4428804da7ae1a96645cd8ae19935c071f93d527098f6b'

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'one_factor'

session:
  secret: 'dd8c12226951fec08ce25ed944e31470eb26e596540e2348dac5ae6a8f52b445'
  cookies:
    - domain: 'authelia.internal'
      authelia_url: 'https://authelia.internal:9091'

storage:
  local:
    path: '/config/db.sqlite3'
  encryption_key: '1690ef0e0e2b8a0f68cca5887a1f0fed'

notifier:
  filesystem:
    filename: '/config/notification.txt'

identity_providers:
  oidc:
    hmac_secret: '1a6844f23b55bcf7e0f62fa19ce86c715256df1b80c58998cf0e3013a9483338'
