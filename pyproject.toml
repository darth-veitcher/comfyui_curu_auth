[project]
name = "comfyui_curu_auth"
version = "1.0.0"
description = "Standalone ComfyUI custom node that gates a ComfyUI backend behind a bearer-token credential -- covers every route ComfyUI serves, including the /ws websocket handshake its own progress streaming depends on."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9", "joserfc>=1.0"]

[project.urls]
Repository = "https://github.com/darth-veitcher/comfyui_curu_auth"
Documentation = "https://github.com/darth-veitcher/comfyui_curu_auth#readme"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.6", "ty>=0.0.1a1"]

# This package is loaded directly by ComfyUI as a raw custom_nodes/ directory --
# it is never `pip install`ed or built into a wheel. `package = false` tells uv
# not to try to build one; this pyproject.toml exists purely to manage the dev/
# test dependency group above.
[tool.semantic_release]
# CONVENTIONAL-COMMIT-DRIVEN RELEASES, so a merged fix produces a version by
# itself and nobody chooses a number. `curu` and `curu-infra` both release this
# way; this repo never adopted it, which is why ten merged PRs -- including two
# real gate fixes on 2026-09-04 -- all still read `0.1.0`. A consumer pinning
# this node therefore had nothing to pin TO.
tag_format = "v{version}"
commit_parser = "conventional"

# WHY `version_toml` IS SET HERE AND DELIBERATELY IS NOT IN THE SIBLINGS.
#
# curu-infra omits it because its `[project]` declares `dynamic = ["version"]`
# and hatch-vcs derives the number from the same git tags PSR writes -- there is
# no literal anywhere, so the two cannot disagree.
#
# That arrangement cannot be copied here. hatch-vcs is a BUILD-backend plugin:
# it injects a version while building a wheel. This project builds no wheel and
# declares so explicitly (`[tool.uv] package = false` below) -- ComfyUI loads it
# as a raw `custom_nodes/` directory and nothing ever pip-installs it. Adding
# hatchling + hatch-vcs would install a build backend nothing invokes, purely to
# animate a field nothing reads.
#
# So the literal has to stay (PEP 621 requires `version` unless `dynamic`), and
# the only question is whether it stays TRUE. `version_toml` is what keeps it
# true. The siblings' principle -- one source of truth, no two records that can
# drift apart -- is preserved; only the mechanism differs, because the mechanism
# they use depends on a build this project does not have.
version_toml = ["pyproject.toml:project.version"]

# PSR's default commit message is a bare `{version}`, which a Conventional
# Commits hook rejects. curu-infra hit exactly this cutting 0.62.0; inherited
# rather than rediscovered.
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]

[tool.semantic_release.branches.main]
match = "main"

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "system: needs a full docker-compose harness (opt-in, not run by default)",
]
addopts = "-ra --strict-markers --import-mode=importlib -m \"not system\""
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.12"
